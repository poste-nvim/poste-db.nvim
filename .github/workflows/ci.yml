name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout poste-db.nvim
        uses: actions/checkout@v4

      - name: Install Lua + LuaRocks
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      # Zero-warning luacheck baseline (established 2026-09-07, extended to
      # tests/ on 2026-09-13): any luacheck warning or error fails the build.
      # W111 (write to an undefined global) was the bug class behind the
      # findings that motivated the baseline.
      - name: Lint
        run: luacheck --codes lua plugin ftplugin tests

  test:
    strategy:
      fail-fast: false
      matrix:
        nvim_version:
          - stable
          - nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout poste-db.nvim
        uses: actions/checkout@v4
        with:
          path: poste-db.nvim

      - name: Checkout poste-ai.nvim (optional AI chat dependency)
        uses: actions/checkout@v4
        with:
          repository: poste-nvim/poste-ai.nvim
          path: poste-ai.nvim

      - name: Install Neovim ${{ matrix.nvim_version }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}

      - name: Install plenary.nvim
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            "$HOME/.local/share/nvim/lazy/plenary.nvim"

      # nvim-treesitter isn't installed here (no `TSInstallSync` — the old
      # step failed with E492 into /dev/null), so build the sql parser the
      # way nvim-treesitter would: generate parser.c from the grammar, then
      # compile parser + external scanner into site/parser. The grammar's
      # v0.3.11 generates tree-sitter ABI 15; current stable/nightly load it.
      - name: Install tree-sitter SQL parser
        run: |
          git clone --depth 1 --branch v0.3.11 \
            https://github.com/DerekStride/tree-sitter-sql /tmp/tree-sitter-sql
          curl -sSLf "https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.13/tree-sitter-linux-x64.gz" \
            | gunzip > /tmp/tree-sitter
          chmod +x /tmp/tree-sitter
          (cd /tmp/tree-sitter-sql && /tmp/tree-sitter generate)
          mkdir -p "$HOME/.local/share/nvim/site/parser"
          cc -O2 -shared -fPIC -o "$HOME/.local/share/nvim/site/parser/sql.so" \
            /tmp/tree-sitter-sql/src/parser.c /tmp/tree-sitter-sql/src/scanner.c \
            -I /tmp/tree-sitter-sql/src
          test -f "$HOME/.local/share/nvim/site/parser/sql.so"

      - name: Run tests
        working-directory: poste-db.nvim
        run: |
          ./tests/run.sh 2>&1

      - name: Show test summary
        working-directory: poste-db.nvim
        if: always()
        run: |
          echo "=== Test output (if any) ==="
          ls -la nvim.log 2>/dev/null && echo "nvim.log exists" || true